<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Código M</title>
  <meta name="description" content="Código M — painel de estudo de Medicina">
  <meta name="theme-color" content="#c8102e">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <div class="app">
    <aside class="lateral" id="lateral" aria-label="Menu principal">
      <a class="marca" href="#/inicio" aria-label="Código M — Início">
        <span class="marca-m">M</span>
        <span class="marca-nome">Código <b>M</b></span>
      </a>
      <nav id="menu"></nav>
      <div class="lateral-rodape" id="lateral-rodape"></div>
    </aside>
    <div class="fundo-menu" id="fundo-menu"></div>

    <div class="principal">
      <header class="barra" id="barra">
        <button class="btn-icone so-movel" id="abrir-menu" aria-label="Abrir menu" aria-controls="lateral"></button>
        <button class="btn-voltar" id="voltar" aria-label="Voltar ao ponto anterior" title="Voltar (Alt+←)"></button>
        <nav class="barra-trilha" id="trilha" aria-label="Você está em"></nav>
        <form class="busca" id="busca" role="search">
          <input id="busca-texto" type="search" placeholder="Buscar assunto, dúvida, material…" aria-label="Buscar" autocomplete="off">
        </form>
        <div class="registrar">
          <button class="btn btn-principal" id="registrar" aria-haspopup="menu" aria-expanded="false"></button>
          <div class="registrar-menu" id="registrar-menu" role="menu" hidden></div>
        </div>
      </header>
      <div class="faixa-simulacao" id="faixa-simulacao" hidden></div>
      <main id="tela" tabindex="-1">
        <p class="carregando">Carregando…</p>
      </main>
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
